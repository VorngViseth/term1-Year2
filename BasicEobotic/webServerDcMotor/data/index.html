<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Motor Control</title>
</head>
    <body>
        <label>
            <input type="radio" name="power" value="backward"> backward
        </label>

        <label>
            <input type="radio" name="power" value="forward" checked> forward
        </label>

        <p>Current speed : <span id="speedText" class="value">100</span></p>

        <label>
            <input type="range" min="0" max="255" value="100" id="slider">
        </label>

    <script src="script.js" defer></script>
    </body>
</html>
